# SSH server inside the student container (host network: listens on the robot's IPs).
# The port is written to /etc/ssh/sshd_config.d/00-port.conf by the entrypoint (SSH_PORT).
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key
PermitRootLogin no
AllowUsers studente
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes
X11Forwarding no
PrintMotd no
